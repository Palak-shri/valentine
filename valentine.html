<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Be My Valentine 💖</title>

<style>
body {
    margin: 0;
    padding: 0;
    height: 100vh;
    background: linear-gradient(to bottom, #ff4d6d, #ffb3c6);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: Arial, sans-serif;
    overflow: hidden;
}

.container {
    text-align: center;
}

h1 {
    color: white;
    font-size: 40px;
    margin-bottom: 40px;
}

button {
    padding: 15px 30px;
    font-size: 20px;
    border: none;
    border-radius: 30px;
    cursor: pointer;
    position: absolute;
}

#yes {
    background: #ff1e56;
    color: white;
    left: 40%;
}

#no {
    background: white;
    color: #ff1e56;
}

/* HEART BALLOON */
.balloon {
    position: absolute;
    width: 60px;
    height: 70px;
    background: red;
    transform: rotate(-45deg);
    animation: floatUp 10s linear infinite;
}

.balloon:before,
.balloon:after {
    content: "";
    position: absolute;
    width: 60px;
    height: 70px;
    background: red;
    border-radius: 50%;
}

.balloon:before {
    top: -30px;
    left: 0;
}

.balloon:after {
    left: 30px;
    top: 0;
}

/* STRING */
.string {
    position: absolute;
    width: 2px;
    height: 80px;
    background: #555;
    left: 30px;
    top: 70px;
}

@keyframes floatUp {
    0% {
        transform: translateY(100vh) rotate(-45deg);
        opacity: 1;
    }
    100% {
        transform: translateY(-120vh) rotate(-45deg);
        opacity: 0.8;
    }
}
</style>
</head>

<body>

<div class="container">
    <h1>Are you my Valentine? 💘</h1>
    <button id="yes" onclick="goYes()">YES 💖</button>
    <button id="no">NO 😅</button>
</div>

<script>
const noBtn = document.getElementById("no");

noBtn.addEventListener("mouseover", moveButton);
noBtn.addEventListener("click", moveButton);

function moveButton() {
    const x = Math.random() * (window.innerWidth - 150);
    const y = Math.random() * (window.innerHeight - 100);
    noBtn.style.left = x + "px";
    noBtn.style.top = y + "px";
}

function goYes() {
    document.body.innerHTML = `
    <h1 style="color:white;font-size:45px;text-align:center;margin-top:30vh;">
        Happy Valentine’s Day ❤️<br>
        You Are My Forever 💕
    </h1>`;
    createBalloons();
}

function createBalloons() {
    setInterval(() => {
        const balloon = document.createElement("div");
        balloon.className = "balloon";
        balloon.style.left = Math.random() * 100 + "vw";
        balloon.style.background = randomColor();

        const string = document.createElement("div");
        string.className = "string";

        balloon.appendChild(string);
        document.body.appendChild(balloon);

        setTimeout(() => {
            balloon.remove();
        }, 10000);
    }, 600);
}

function randomColor() {
    const colors = ["#ff1e56", "#ff4d6d", "#ff6f91"];
    return colors[Math.floor(Math.random() * colors.length)];
}
</script>

</body>
</html>
